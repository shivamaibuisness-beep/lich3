        * {

            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

        /* Animated background */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, #1a0a2e 0%, #0a0a0f 50%, #000000 100%);

        }

        .bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 50, 80, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.12) 0%, transparent 40%);
            animation: moveBg 20s ease-in-out infinite alternate;
        }

        @keyframes moveBg {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 1;

            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #ff3c5a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }

        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);

            font-weight: 500;

        /* Glass card */

            color: #ff3c5a;

            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 60, 90, 0.3);
        }

        .badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ff3c5a;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-top: 8px;

        .feature {

        /* CTA Button */

            color: white;
            font-size: 17px;

            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
